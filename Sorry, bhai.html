<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sorry, bhai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;800&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F1FB; --ink:#1D2040; --muted:#5A5E86; --line:#D9D3EA; --star:#E7B7D1;
  --accent:#C93A69; --on-accent:#FFFFFF; --glow:rgba(255,201,120,.5);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12142A; --ink:#F3EFFF; --muted:#A9ACD1; --line:#343A73; --star:#FFFFFF;
    --accent:#F7A8C0; --on-accent:#12142A; --glow:rgba(255,201,120,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#12142A; --ink:#F3EFFF; --muted:#A9ACD1; --line:#343A73; --star:#FFFFFF;
  --accent:#F7A8C0; --on-accent:#12142A; --glow:rgba(255,201,120,.25);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  line-height:1.5; overflow-x:hidden;
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#sky{position:fixed; inset:0; z-index:0; pointer-events:none}
#sky i{position:absolute; border-radius:50%; background:var(--star); animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
#fx{position:fixed; inset:0; pointer-events:none; z-index:8; overflow:hidden}
#fxc{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:9}
.fl{position:absolute; bottom:-40px; animation:floatUp 2.6s ease-out forwards}
@keyframes floatUp{
  0%{transform:translateY(0) rotate(-10deg); opacity:0}
  15%{opacity:1}
  100%{transform:translateY(-70vh) rotate(12deg); opacity:0}
}
main{position:relative; z-index:1; width:100%; max-width:520px; margin:0 auto}

/* Home */
#home{min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:32px 20px}
h1{font-family:"Shippori Mincho B1",Georgia,serif; font-weight:800; font-size:clamp(1.9rem,8vw,2.6rem); line-height:1.2; margin:0 0 8px}
.sub{margin:0 0 34px; color:var(--muted)}
#list{display:flex; flex-direction:column; align-items:center; gap:10px}
.name{
  font:inherit; background:none; border:0; color:var(--ink); cursor:pointer; padding:6px 10px;
  display:flex; flex-direction:column; align-items:center; gap:0;
  animation:rise .7s ease backwards; animation-delay:calc(var(--i) * .15s + .1s);
}
.nm{
  font-family:"Shippori Mincho B1",Georgia,serif; font-weight:800; font-size:clamp(2.3rem,11vw,3.6rem); line-height:1.15;
  background:linear-gradient(var(--accent),var(--accent)) 0 100% / 0 .1em no-repeat;
  transition:background-size .35s ease, transform .2s;
}
.name:hover .nm,.name:focus-visible .nm{background-size:100% .1em; transform:scale(1.04)}
.name:active .nm{transform:scale(.97)}
.tk{font-size:.9rem; color:var(--accent); font-weight:700; min-height:1.3em}
@keyframes rise{from{opacity:0; transform:translateY(24px)}}
:is(.name,.btn,.back,.linkbtn):focus-visible{outline:3px solid var(--accent); outline-offset:3px; border-radius:12px}

/* Scene */
#scene{min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; text-align:center; padding:14px 20px 28px}
.back{align-self:flex-start; font:inherit; font-weight:700; color:var(--muted); background:none; border:0; cursor:pointer; padding:8px 4px}
.to{margin:18px 0 0; font-family:"Shippori Mincho B1",Georgia,serif; font-weight:800; font-size:clamp(1.15rem,5vw,1.5rem); line-height:1.35}
.stage{position:relative; width:min(72vw,300px); margin:6px auto 0}
#boy{cursor:pointer; -webkit-tap-highlight-color:transparent}
#boy:focus-visible{outline:3px solid var(--accent); outline-offset:4px; border-radius:12px}
.stage svg{display:block; width:100%; height:auto; overflow:visible}
.caption{
  font-family:"Shippori Mincho B1",Georgia,serif; font-weight:800;
  font-size:clamp(1.8rem,8.5vw,2.7rem); line-height:1.15; margin:10px 0 0; min-height:2.4em;
  display:flex; align-items:center; justify-content:center; flex-wrap:wrap; max-width:100%;
}
.caption.big{font-size:clamp(3.4rem,20vw,6rem); color:var(--accent); min-height:1.2em}
.w{display:inline-block; white-space:nowrap}
.ch{
  display:inline-block; opacity:0; transform:translateY(16px) scale(.6);
  animation:pop .45s cubic-bezier(.2,1.5,.4,1) forwards; animation-delay:calc(var(--d) * 45ms);
}
@keyframes pop{to{opacity:1; transform:none}}
.ctrl{margin-top:auto; padding-top:22px; display:flex; flex-direction:column; align-items:center; gap:16px; width:100%}
.dots{display:flex; gap:10px}
.dots i{width:10px; height:10px; border-radius:50%; background:var(--line); transition:background .3s, transform .3s}
.dots i.on{background:var(--accent); transform:scale(1.25)}
.btn{
  font:inherit; font-weight:700; font-size:1.15rem; cursor:pointer; border:0;
  background:var(--accent); color:var(--on-accent); border-radius:16px; padding:15px 38px;
  box-shadow:0 8px 28px var(--glow); transition:transform .15s;
}
.btn:active{transform:scale(.96)}
.btn.soft{background:transparent; color:var(--ink); border:2px solid var(--line); box-shadow:none}
.ask{display:flex; gap:12px; justify-content:center; flex-wrap:wrap}

/* Boy */
#boy #all{transform-origin:150px 330px; animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-3px)}}
#upper{transform-origin:150px 296px}
#head{transform-origin:150px 172px}
#armR{transform-origin:188px 190px}
#armL{transform-origin:112px 190px}
#armR,#armL{transition:transform .4s ease}
.blink{transform-origin:150px 119px; animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.f{display:none}
svg[data-mood="sad"] .f.sad,
svg[data-mood="promise"] .f.promise,
svg[data-mood="cry"] .f.cry,
svg[data-mood="hope"] .f.hope,
svg[data-mood="happy"] .f.happy,
svg[data-mood="ouch"] .f.ouch{display:inline}
.tear{animation:drop 1.5s ease-in infinite}
svg[data-mood="cry"] .tear{animation-duration:.7s}
@keyframes drop{0%{transform:translateY(0); opacity:0}15%{opacity:1}100%{transform:translateY(46px); opacity:0}}

.act-bow #upper{animation:bow 2.4s ease-in-out}
.act-bow #head{animation:nod 2.4s ease-in-out}
@keyframes bow{0%{transform:none}35%,65%{transform:translateY(46px) scale(1,.8)}100%{transform:none}}
@keyframes nod{0%{transform:none}35%,65%{transform:translateY(10px) rotate(7deg)}100%{transform:none}}

.act-promise #armR{animation:raise 2.6s ease forwards}
@keyframes raise{
  0%{transform:rotate(0)} 30%{transform:rotate(-155deg)} 42%{transform:rotate(-170deg)}
  54%{transform:rotate(-150deg)} 66%{transform:rotate(-170deg)} 78%{transform:rotate(-152deg)} 100%{transform:rotate(-158deg)}
}

.act-cry #head{animation:sob .45s ease-in-out infinite alternate}
.act-cry #upper{animation:shake .9s ease-in-out infinite}
@keyframes sob{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes shake{50%{transform:translateY(4px)}}

.act-hope #head{animation:tilt 1.6s ease-in-out infinite alternate}
@keyframes tilt{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}

.stage.hit svg{transform-origin:50% 95%; animation:hit .7s ease-in-out}
@keyframes hit{
  0%{transform:none} 15%{transform:translateX(-12px) rotate(-6deg) scale(.95,1.05)}
  30%{transform:translateX(12px) rotate(6deg)} 45%{transform:translateX(-8px) rotate(-4deg)}
  60%{transform:translateX(6px) rotate(3deg)} 100%{transform:none}
}
.ouchtxt{
  position:absolute; top:2%; right:-4%; z-index:2; pointer-events:none; opacity:0;
  font-family:"Shippori Mincho B1",Georgia,serif; font-weight:800; font-size:1.7rem; color:var(--accent);
}
.ouchtxt.show{animation:ouchtxt 1s ease-out}
@keyframes ouchtxt{
  0%{opacity:0; transform:scale(.4) rotate(-12deg)} 20%{opacity:1; transform:scale(1.2) rotate(8deg)}
  70%{opacity:1; transform:scale(1) rotate(4deg)} 100%{opacity:0; transform:translateY(-22px)}
}
.act-happy #armR{transform:rotate(-158deg)}
.act-happy #armL{transform:rotate(158deg)}
.act-happy #boy-hop{animation:hop .6s ease-in-out 4}
@keyframes hop{50%{transform:translateY(-34px)}}
#boy-hop{transform-origin:150px 330px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important; transition:none !important}
  .ch{opacity:1; transform:none}
  .name{animation:none}
  #sky i{opacity:.5}
}
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<div id="fx" aria-hidden="true"></div>
<canvas id="fxc" aria-hidden="true"></canvas>

<main>
  <section id="scene">
    <p class="to" id="to">Ahmed bhai, Armaan bhai &amp; Yafi bhai</p>

    <div class="stage" id="stage">
      <div class="ouchtxt" id="ouchtxt" aria-hidden="true">Ouch!</div>
      <svg id="boy" viewBox="0 0 300 350" data-mood="sad" role="button" tabindex="0" aria-label="The boy. Tap to poke him">
        <ellipse cx="150" cy="338" rx="100" ry="10" fill="#000" opacity=".16"/>
        <g id="boy-hop"><g id="all">
          <rect x="70" y="292" width="160" height="44" rx="22" fill="#3B3F6B"/>
          <g id="upper">
            <path d="M104 202 Q104 172 130 168 L170 168 Q196 172 196 202 L202 298 L98 298 Z" fill="#7C83FF"/>
            <path d="M132 168 L150 194 L168 168 Z" fill="#fff" opacity=".92"/>
            <rect x="138" y="148" width="24" height="26" rx="9" fill="#F2C29B"/>
            <g id="armL">
              <line x1="112" y1="192" x2="140" y2="262" stroke="#7C83FF" stroke-width="22" stroke-linecap="round"/>
              <circle cx="142" cy="265" r="12" fill="#FFD9B8"/>
            </g>
            <g id="armR">
              <line x1="188" y1="192" x2="160" y2="262" stroke="#7C83FF" stroke-width="22" stroke-linecap="round"/>
              <circle cx="158" cy="265" r="12" fill="#FFD9B8"/>
            </g>
            <g id="head">
              <circle cx="94" cy="120" r="9" fill="#F2C29B"/>
              <circle cx="206" cy="120" r="9" fill="#F2C29B"/>
              <circle cx="150" cy="115" r="56" fill="#FFD9B8"/>
              <path d="M93 112 Q88 52 150 48 Q212 52 207 112 Q198 84 176 80 Q164 94 150 82 Q136 94 124 80 Q102 84 93 112 Z" fill="#2A2438"/>
              <path d="M112 58 L104 34 L132 50 Z M146 50 L156 26 L168 50 Z M172 52 L192 36 L194 64 Z" fill="#2A2438"/>
              <g class="f ouch">
                <rect x="126" y="62" width="48" height="15" rx="7" fill="#F6DDBF" stroke="#C9A27A" stroke-width="1.5" transform="rotate(-12 150 70)"/>
                <rect x="141" y="64" width="18" height="11" fill="#E9C79F" transform="rotate(-12 150 70)"/>
              </g>

              <circle cx="110" cy="136" r="10" fill="#FF8FA3" opacity=".4"/>
              <circle cx="190" cy="136" r="10" fill="#FF8FA3" opacity=".4"/>

              <g class="f sad promise hope blink">
                <ellipse cx="128" cy="119" rx="12" ry="14" fill="#fff" stroke="#2A2438" stroke-width="2"/>
                <ellipse cx="172" cy="119" rx="12" ry="14" fill="#fff" stroke="#2A2438" stroke-width="2"/>
                <circle cx="129" cy="122" r="8" fill="#2A2438"/>
                <circle cx="171" cy="122" r="8" fill="#2A2438"/>
                <circle cx="132" cy="118" r="3" fill="#fff"/>
                <circle cx="174" cy="118" r="3" fill="#fff"/>
              </g>
              <g class="f hope">
                <circle cx="125" cy="115" r="2.5" fill="#fff"/>
                <circle cx="167" cy="115" r="2.5" fill="#fff"/>
                <ellipse cx="128" cy="130" rx="9" ry="3" fill="#9ED8FF" opacity=".7"/>
                <ellipse cx="172" cy="130" rx="9" ry="3" fill="#9ED8FF" opacity=".7"/>
              </g>
              <g class="f cry ouch" fill="none" stroke="#2A2438" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M116 108 L138 120 L116 132"/>
                <path d="M184 108 L162 120 L184 132"/>
              </g>
              <g class="f happy" fill="none" stroke="#2A2438" stroke-width="4" stroke-linecap="round">
                <path d="M114 124 Q128 106 142 124"/>
                <path d="M158 124 Q172 106 186 124"/>
              </g>

              <g class="f sad hope cry ouch" fill="none" stroke="#2A2438" stroke-width="4" stroke-linecap="round">
                <path d="M112 100 L140 92"/><path d="M188 100 L160 92"/>
              </g>
              <g class="f promise" fill="none" stroke="#2A2438" stroke-width="4" stroke-linecap="round">
                <path d="M114 94 L140 98"/><path d="M186 94 L160 98"/>
              </g>

              <path class="f sad" d="M138 151 Q150 141 162 151" fill="none" stroke="#2A2438" stroke-width="3.5" stroke-linecap="round"/>
              <path class="f promise" d="M139 148 Q150 153 161 148" fill="none" stroke="#2A2438" stroke-width="3.5" stroke-linecap="round"/>
              <path class="f hope" d="M139 151 Q144 145 150 151 Q156 157 161 151" fill="none" stroke="#2A2438" stroke-width="3.5" stroke-linecap="round"/>
              <g class="f cry ouch">
                <ellipse cx="150" cy="153" rx="13" ry="10" fill="#7A2540"/>
                <ellipse cx="150" cy="159" rx="7" ry="4" fill="#FF8FA3"/>
              </g>
              <g class="f happy">
                <path d="M128 140 Q150 172 172 140 Z" fill="#7A2540"/>
                <path d="M138 152 Q150 166 162 152 Q150 148 138 152 Z" fill="#FF8FA3"/>
              </g>

              <g class="f sad cry hope" fill="#7CC8FF">
                <ellipse class="tear" cx="124" cy="134" rx="3" ry="5"/>
                <ellipse class="tear" cx="176" cy="134" rx="3" ry="5" style="animation-delay:.5s"/>
                <ellipse class="tear" cx="119" cy="134" rx="3" ry="5" style="animation-delay:.9s"/>
                <ellipse class="tear" cx="181" cy="134" rx="3" ry="5" style="animation-delay:1.2s"/>
              </g>
            </g>
          </g>
        </g></g>
      </svg>
    </div>

    <p class="caption" id="caption" aria-live="polite"></p>

    <div class="ctrl">
      <div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <button class="btn" id="gen">Generate sorry</button>
      <div class="ask" id="ask" hidden>
        <button class="btn" id="yes">Okay</button>
      </div>
      <div id="end" hidden>
        <button class="btn soft" id="another">Say it again</button>
      </div>
    </div>
  </section>
</main>

<script>
(function(){
  var NAMES = ["Ahmed bhai","Armaan bhai","Yafi bhai"];
  var STEPS = [
    {text:"Sorry for my mistake", mood:"sad",     act:"bow",     emoji:["🙇","💔"]},
    {text:"I won't repeat it again", mood:"promise", act:"promise", emoji:["🤞","🤝"]},
    {text:"Sorry", mood:"cry", act:"cry", emoji:["😭","💖"], fx:"petals", big:true},
    {text:"Forgive me?", mood:"hope", act:"hope", emoji:["🥺"], ask:true}
  ];
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var $ = function(id){ return document.getElementById(id); };
  var to=$("to"),
      cap=$("caption"), boy=$("boy"), stage=$("stage"), gen=$("gen"), ask=$("ask"),
      yes=$("yes"), end=$("end"), another=$("another"), fx=$("fx");
  var dots = Array.prototype.slice.call(document.querySelectorAll(".dots i"));
  var name = "", idx = -1, noCount = 0;

  /* Stars */
  var sky = $("sky");
  for (var s = 0; s < 40; s++){
    var st = document.createElement("i");
    var sz = 2 + Math.random() * 3;
    st.style.cssText = "left:" + (Math.random()*100) + "%;top:" + (Math.random()*100) + "%;width:" + sz + "px;height:" + sz +
      "px;animation-delay:" + (Math.random()*3) + "s";
    sky.appendChild(st);
  }


  function setMood(m){ boy.setAttribute("data-mood", m); }
  function setAct(a){
    boy.setAttribute("class", "");
    boy.getBoundingClientRect();
    if (a) boy.setAttribute("class", "act-" + a);
  }

  function setCaption(text, big){
    cap.innerHTML = "";
    cap.classList.toggle("big", !!big);
    var sr = document.createElement("span"); sr.className = "sr"; sr.textContent = text; cap.appendChild(sr);
    var n = 0;
    text.split(" ").forEach(function(word, wi, arr){
      var w = document.createElement("span"); w.className = "w"; w.setAttribute("aria-hidden","true");
      word.split("").forEach(function(ch){
        var c = document.createElement("span"); c.className = "ch";
        c.style.setProperty("--d", n++); c.textContent = ch; w.appendChild(c);
      });
      cap.appendChild(w);
      if (wi < arr.length - 1) cap.appendChild(document.createTextNode(" "));
    });
  }

  function resetScene(){
    idx = -1; noCount = 0;
    gen.hidden = false; gen.textContent = "Generate sorry";
    ask.hidden = true; end.hidden = true;
    dots.forEach(function(d){ d.classList.remove("on"); });
    setMood("sad"); setAct("");
  }

  function start(){
    resetScene();
    setCaption("I have something to say…");
    window.scrollTo(0, 0);
  }

  function advance(){
    idx++;
    var st = STEPS[idx];
    setCaption(st.text, st.big);
    setMood(st.mood); setAct(st.act);
    dots.forEach(function(d, i){ d.classList.toggle("on", i <= idx); });
    floaters(st.emoji);
    if (st.fx === "petals") burst("petals");
    if (st.ask){ gen.hidden = true; ask.hidden = false; }
    else { gen.textContent = "Next"; }
  }

  function forgive(){
    ask.hidden = true; end.hidden = false;
    setCaption("Thank you, bhai!");
    setMood("happy"); setAct("happy");
    dots.forEach(function(d){ d.classList.add("on"); });
    floaters(["🎉","💖","✨"]);
    burst("pop");
  }

  gen.addEventListener("click", advance);
  yes.addEventListener("click", forgive);
  another.addEventListener("click", start);

  /* Poke the boy */
  var ouchBusy = false, ouchTxt = $("ouchtxt");
  function poke(){
    if (ouchBusy) return;
    ouchBusy = true;
    var prev = boy.getAttribute("data-mood");
    setMood("ouch");
    stage.classList.remove("hit"); stage.getBoundingClientRect(); stage.classList.add("hit");
    ouchTxt.classList.remove("show"); ouchTxt.getBoundingClientRect(); ouchTxt.classList.add("show");
    floaters(["🤕" , "😵‍💫"]);
    setTimeout(function(){
      if (boy.getAttribute("data-mood") === "ouch") setMood(prev);
      stage.classList.remove("hit"); ouchTxt.classList.remove("show");
      ouchBusy = false;
    }, 900);
  }
  boy.addEventListener("click", poke);
  boy.addEventListener("keydown", function(e){
    if (e.key === "Enter" || e.key === " "){ e.preventDefault(); poke(); }
  });
  start();

  /* Floating emoji */
  function floaters(arr){
    if (reduce || !arr) return;
    for (var i = 0; i < 8; i++){
      var s = document.createElement("span");
      s.className = "fl"; s.textContent = arr[i % arr.length];
      s.style.left = (6 + Math.random() * 86) + "%";
      s.style.fontSize = (22 + Math.random() * 22) + "px";
      s.style.animationDelay = (Math.random() * .7) + "s";
      s.addEventListener("animationend", function(){ this.remove(); });
      fx.appendChild(s);
    }
  }

  /* Particles */
  var cv = $("fxc"), ctx = cv.getContext("2d"), parts = [], run = false, W = 0, H = 0;
  function size(){
    var d = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight;
    cv.width = W * d; cv.height = H * d; ctx.setTransform(d,0,0,d,0,0);
  }
  addEventListener("resize", size); size();
  var COL = ["#F7A8C0","#FFC978","#E0527F","#C9B6FF","#8EE3C8"];
  function burst(mode){
    if (reduce) return;
    var n = mode === "pop" ? 90 : 60;
    for (var k = 0; k < n; k++){
      var p = {c: COL[(Math.random() * COL.length) | 0], r: 5 + Math.random() * 6,
               a: Math.random() * 6.28, va: (Math.random() - .5) * .2, sw: Math.random() * 6.28};
      if (mode === "pop"){
        var r = stage.getBoundingClientRect();
        var ang = -Math.PI / 2 + (Math.random() - .5) * 2.4, sp = 6 + Math.random() * 8;
        p.x = r.left + r.width / 2; p.y = r.top + r.height * .4;
        p.vx = Math.cos(ang) * sp; p.vy = Math.sin(ang) * sp; p.g = .25;
      } else {
        p.x = Math.random() * W; p.y = -20 - Math.random() * 200;
        p.vx = (Math.random() - .5) * 1.2; p.vy = 1.2 + Math.random() * 2; p.g = 0;
      }
      parts.push(p);
    }
    if (!run){ run = true; requestAnimationFrame(tick); }
  }
  function tick(){
    ctx.clearRect(0, 0, W, H);
    parts = parts.filter(function(p){ return p.y < H + 30; });
    parts.forEach(function(p){
      p.sw += .03; p.vy += p.g; p.vx *= p.g ? .99 : 1;
      p.x += p.vx + Math.sin(p.sw) * (p.g ? .2 : .8); p.y += p.vy; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
      ctx.fillStyle = p.c; ctx.globalAlpha = .9;
      ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * .55, 0, 0, 6.28); ctx.fill();
      ctx.restore();
    });
    if (parts.length){ requestAnimationFrame(tick); }
    else { run = false; ctx.clearRect(0, 0, W, H); }
  }
})();
</script>
